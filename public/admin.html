<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>botadb admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{--bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--line:#272c3a;--text:#e7e9ee;--dim:#9aa3b2;--accent:#4f8cff;--ok:#2ecc71;--off:#e74c3c;--radius:12px}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  a{color:var(--accent)}
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  .side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
  .brand{font-weight:700;font-size:18px;margin:4px 8px 18px;display:flex;align-items:center;gap:8px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--dim);cursor:pointer}
  .nav:hover{background:var(--panel2);color:var(--text)}
  .nav.active{background:var(--accent);color:#fff}
  .side .spacer{flex:1}
  .side .me{font-size:12px;color:var(--dim);padding:8px 12px;border-top:1px solid var(--line)}
  .main{padding:22px 26px;overflow:auto}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .head h1{font-size:20px;margin:0}
  .head .sub{color:var(--dim);font-size:13px;margin-top:3px}
  .pill{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card .k{color:var(--dim);font-size:12px}.card .v{font-size:26px;font-weight:700;margin-top:6px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px;overflow:hidden}
  .panel .ph{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .panel .pb{padding:16px}
  #map{height:320px;width:100%}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase}
  tbody tr{cursor:pointer}tbody tr:hover{background:var(--panel2)}
  .st{display:inline-flex;align-items:center;gap:6px}.st .d{width:8px;height:8px;border-radius:50%}
  .st.on .d{background:var(--ok)}.st.off .d{background:var(--off)}
  .mono{font-family:ui-monospace,Consolas,monospace}
  .form{max-width:620px}
  .form label{display:block;color:var(--dim);font-size:12px;margin:14px 0 6px}
  .form input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;font-family:ui-monospace,Consolas,monospace}
  .form input:focus{outline:none;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;margin-top:18px}
  .note{color:var(--dim);font-size:12px;margin-top:10px}
  .drawer{position:fixed;top:0;right:0;width:460px;max-width:92vw;height:100vh;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:.22s;z-index:900;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
  .drawer .db{padding:18px 20px;overflow:auto}
  .close{cursor:pointer;color:var(--dim);font-size:22px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px;margin-bottom:18px}
  .kv .lbl{color:var(--dim)}
  .tabs{display:flex;gap:6px;margin:4px 0 12px}
  .tab{padding:6px 12px;border-radius:7px;background:var(--panel2);color:var(--dim);cursor:pointer;font-size:12px}
  .tab.active{background:var(--accent);color:#fff}
  .log{border-left:2px solid var(--line);padding:4px 0 10px 12px;margin-left:4px;position:relative}
  .log:before{content:"";position:absolute;left:-5px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .log.error:before{background:var(--off)}.log.system:before{background:var(--accent)}
  .log .t{font-size:11px;color:var(--dim)}.log .m{font-size:13px;margin-top:2px}
  .hidden{display:none}
  /* login overlay */
  .login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000}
  .login .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;width:320px}
  .login h2{margin:0 0 18px}
  .login input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--text);margin-bottom:12px}
  .login .err{color:var(--off);font-size:13px;min-height:18px}
  @media(max-width:860px){.app{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<!-- LOGIN -->
<div class="login hidden" id="login">
  <div class="box">
    <h2>botadb admin</h2>
    <input id="luser" placeholder="username" autocomplete="username">
    <input id="lpass" type="password" placeholder="password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn" style="width:100%;margin-top:4px" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="brand"><span class="dot"></span> botadb</div>
    <div class="nav active" data-view="devices">เครื่องทั้งหมด</div>
    <div class="nav" data-view="config">ตั้งค่า (config)</div>
    <div class="spacer"></div>
    <div class="me">👤 admin · <span style="color:var(--accent);cursor:pointer" onclick="doLogout()">ออกจากระบบ</span></div>
  </aside>
  <main class="main">
    <section id="view-devices">
      <div class="head"><div><h1>เครื่องทั้งหมด</h1><div class="sub" id="dsub">—</div></div>
        <span class="pill" id="dpill">—</span></div>
      <div class="cards" id="cards"></div>
      <div class="panel"><div class="ph">🗺️ ตำแหน่งเครื่อง <span class="pill">คลิกหมุดดูข้อมูล</span></div><div id="map"></div></div>
      <div class="panel"><div class="ph">รายการเครื่อง</div>
        <table><thead><tr><th>Serial</th><th>ชื่อ</th><th>Version</th><th>แบต</th><th>สถานะ</th><th>อัปเดตล่าสุด</th></tr></thead>
        <tbody id="rows"></tbody></table></div>
    </section>
    <section id="view-config" class="hidden">
      <div class="head"><div><h1>ตั้งค่า (config)</h1><div class="sub">แก้แล้วทุกบอตได้ค่าใหม่ในรอบ loop ถัดไป</div></div></div>
      <div class="panel"><div class="pb"><div class="form" id="cfgForm">
        <label>main_url_lao</label><input id="cfg_main_url_lao">
        <label>main_url_thai</label><input id="cfg_main_url_thai">
        <label>upload_file_url</label><input id="cfg_upload_file_url">
        <div><button class="btn" onclick="saveConfig()">บันทึก</button></div>
        <div class="note" id="cfgNote"></div>
      </div></div></div>
    </section>
  </main>
</div>

<div class="drawer" id="drawer">
  <div class="dh"><div><div style="font-weight:700;font-size:16px" id="dName">—</div>
    <div class="mono" style="color:var(--dim);font-size:12px" id="dSerial"></div></div>
    <span class="close" onclick="closeDrawer()">&times;</span></div>
  <div class="db">
    <div class="kv" id="dKv"></div>
    <div class="tabs"><div class="tab active" data-tab="logs">Log</div><div class="tab" data-tab="gps">GPS 24 ชม.</div></div>
    <div id="dLogs"></div><div id="dGps" class="hidden"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n) => (typeof n === 'number' && isFinite(n) ? n : '');
let devices = [], map, markers = [];

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
  if (res.status === 401) { showLogin(); throw new Error('unauth'); }
  return res;
}
function showLogin() { $('login').classList.remove('hidden'); $('app').classList.add('hidden'); }
function hideLogin() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); }

async function doLogin() {
  $('lerr').textContent = '';
  const r = await fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: $('luser').value, password: $('lpass').value }) });
  if (r.ok) { hideLogin(); boot(); } else { $('lerr').textContent = 'เข้าสู่ระบบไม่สำเร็จ'; }
}
async function doLogout() { await fetch('/admin/logout', { method: 'POST' }); showLogin(); }

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return s + ' วินาที';
  if (s < 3600) return Math.floor(s / 60) + ' นาที';
  if (s < 86400) return Math.floor(s / 3600) + ' ชม.';
  return Math.floor(s / 86400) + ' วัน';
}

async function loadDevices() {
  const res = await api('/admin/api/devices');
  devices = await res.json();
  const on = devices.filter((d) => d.online).length;
  const vers = [...new Set(devices.map((d) => d.botVersion).filter(Boolean))].sort().reverse();
  $('dsub').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH');
  $('dpill').textContent = `🟢 ออนไลน์ ${on} / ${devices.length} เครื่อง`;
  $('cards').innerHTML = `
    <div class="card"><div class="k">เครื่องทั้งหมด</div><div class="v">${devices.length}</div></div>
    <div class="card"><div class="k">ออนไลน์</div><div class="v" style="color:var(--ok)">${on}</div></div>
    <div class="card"><div class="k">ออฟไลน์</div><div class="v" style="color:var(--off)">${devices.length - on}</div></div>
    <div class="card"><div class="k">เวอร์ชันล่าสุด</div><div class="v">${esc(vers[0] || '—')}</div></div>`;
  $('rows').innerHTML = devices.map((d, i) => `<tr onclick="openDrawer(${i})">
    <td class="mono">${esc(d.serial)}</td><td>${esc(d.name || '—')}</td><td>${esc(d.botVersion || '—')}</td>
    <td>${d.battery != null ? num(d.battery) + '%' : '—'}</td>
    <td><span class="st ${d.online ? 'on' : 'off'}"><span class="d"></span>${d.online ? 'online' : 'offline'}</span></td>
    <td style="color:var(--dim)">${esc(timeAgo(d.lastSeen))}ที่แล้ว</td></tr>`).join('');
  drawMap();
}
function drawMap() {
  if (!map) { map = L.map('map', { attributionControl: false }).setView([15, 101], 6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map); }
  markers.forEach((m) => map.removeLayer(m)); markers = [];
  devices.forEach((d, i) => {
    if (!d.latestGps) return;
    const m = L.circleMarker([d.latestGps.lat, d.latestGps.lng], { radius: 8, color: '#fff', weight: 1.5,
      fillColor: d.online ? '#2ecc71' : '#e74c3c', fillOpacity: .9 }).addTo(map);
    m.bindPopup(`<b>${esc(d.name || d.serial)}</b><br>${esc(d.serial)}<br>แบต ${d.battery != null ? num(d.battery) + '%' : '—'} · ${esc(timeAgo(d.lastSeen))}ที่แล้ว`);
    m.on('click', () => openDrawer(i)); markers.push(m);
  });
}

async function loadConfig() {
  const res = await api('/admin/api/config');
  const c = await res.json();
  ['main_url_lao', 'main_url_thai', 'upload_file_url'].forEach((k) => { $('cfg_' + k).value = c[k] || ''; });
}
async function saveConfig() {
  const body = {};
  ['main_url_lao', 'main_url_thai', 'upload_file_url'].forEach((k) => { body[k] = $('cfg_' + k).value.trim(); });
  const res = await api('/admin/api/config', { method: 'PUT', body: JSON.stringify(body) });
  $('cfgNote').textContent = res.ok ? '✓ บันทึกแล้ว ' + new Date().toLocaleTimeString('th-TH') : 'บันทึกไม่สำเร็จ';
}

async function openDrawer(i) {
  const d = devices[i];
  $('dName').textContent = d.name || d.serial; $('dSerial').textContent = d.serial;
  const gps = d.latestGps;
  const lat = gps ? num(gps.lat) : '', lng = gps ? num(gps.lng) : '';
  $('dKv').innerHTML = `
    <div class="lbl">รุ่น</div><div>${esc(d.brand || '')} ${esc(d.model || '—')}</div>
    <div class="lbl">Android</div><div>${esc(d.androidVersion || '—')}</div>
    <div class="lbl">Bot version</div><div>${esc(d.botVersion || '—')}</div>
    <div class="lbl">แบต</div><div>${d.battery != null ? num(d.battery) + '%' : '—'}</div>
    <div class="lbl">WiFi</div><div>${esc(d.wifiSsid || '—')} · ${esc(d.wifiIp || '')}</div>
    <div class="lbl">PC IP</div><div>${esc(d.publicIp || '—')} ${esc(d.pcLocation || '')}</div>
    <div class="lbl">ตำแหน่ง</div><div>${gps ? `${lat}, ${lng} <a href="https://maps.google.com/?q=${lat},${lng}" target="_blank">แผนที่</a>` : '—'}</div>
    <div class="lbl">อัปเดตล่าสุด</div><div>${esc(timeAgo(d.lastSeen))}ที่แล้ว</div>`;
  const logs = await (await api(`/admin/api/devices/${d.id}/logs`)).json();
  $('dLogs').innerHTML = logs.length ? logs.map((l) =>
    `<div class="log ${esc(l.level)}"><div class="t">${esc(new Date(l.createdAt).toLocaleString('th-TH'))} · ${esc(l.level)}</div><div class="m">${esc(l.message)}</div></div>`).join('') : '<div class="note">ยังไม่มี log</div>';
  const g = await (await api(`/admin/api/devices/${d.id}/gps`)).json();
  $('dGps').innerHTML = g.history.length ? g.history.map((p) =>
    `<div class="log"><div class="t">${esc(new Date(p.createdAt).toLocaleString('th-TH'))}</div><div class="m mono">${num(p.lat)}, ${num(p.lng)}</div></div>`).join('') : '<div class="note">ยังไม่มีพิกัด</div>';
  $('drawer').classList.add('open');
}
function closeDrawer() { $('drawer').classList.remove('open'); }

document.querySelectorAll('.nav').forEach((n) => n.onclick = () => {
  document.querySelectorAll('.nav').forEach((x) => x.classList.remove('active')); n.classList.add('active');
  const v = n.dataset.view;
  $('view-devices').classList.toggle('hidden', v !== 'devices');
  $('view-config').classList.toggle('hidden', v !== 'config');
  if (v === 'devices' && map) setTimeout(() => map.invalidateSize(), 50);
  if (v === 'config') loadConfig();
});
document.querySelectorAll('.tab').forEach((t) => t.onclick = () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active')); t.classList.add('active');
  $('dLogs').classList.toggle('hidden', t.dataset.tab !== 'logs');
  $('dGps').classList.toggle('hidden', t.dataset.tab !== 'gps');
});
$('lpass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

async function boot() { try { await loadDevices(); await loadConfig(); } catch (e) {} }
// initial: probe auth
api('/admin/api/devices').then(() => { hideLogin(); boot(); }).catch(() => {});
